<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mirrored Pages">
  <defs>
    <linearGradient id="mpl-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#9aa6b4"/>
      <stop offset=".5" stop-color="#e6ecf3"/><stop offset=".74" stop-color="#6f7b8b"/><stop offset="1" stop-color="#dfe6ee"/>
    </linearGradient>
    <radialGradient id="mpl-glass" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#1c2230"/><stop offset=".6" stop-color="#0e121b"/><stop offset="1" stop-color="#07090e"/>
    </radialGradient>
    <linearGradient id="mpl-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3e0"/>
    </linearGradient>
    <linearGradient id="mpl-twin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d3e0" stop-opacity=".55"/><stop offset="1" stop-color="#b39af0" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#mpl-rim)"/>
  <circle cx="60" cy="60" r="51.5" fill="url(#mpl-glass)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#c9d3e0" stroke-opacity=".18"/>
  <g transform="translate(60 59) scale(.98) translate(-60 -59)">
  <!-- the page -->
  <path d="M58 37C49 31 38 30 29 33v48c9-3 20-2 29 4Z" fill="url(#mpl-page)"/>
  <!-- its mirrored twin -->
  <path d="M62 37c9-6 20-7 29-4v48c-9-3-20-2-29 4Z" fill="url(#mpl-twin)" stroke="#e6ecf3" stroke-opacity=".7" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="none" stroke-linecap="round">
    <path d="M36 45c6-1.4 11-.8 16 1.6M36 53c6-1.4 11-.8 16 1.6M36 61c6-1.4 11-.8 16 1.6M36 69c4-1 8-.8 11 .6" stroke="#10141c" stroke-opacity=".55" stroke-width="2"/>
    <path d="M84 45c-6-1.4-11-.8-16 1.6M84 53c-6-1.4-11-.8-16 1.6M84 61c-6-1.4-11-.8-16 1.6M84 69c-4-1-8-.8-11 .6" stroke="#e6ecf3" stroke-opacity=".38" stroke-width="2"/>
    <path d="M77 36l-4 10 5 5-6 9 2 8" stroke="#ffffff" stroke-width="1.1" stroke-opacity=".85"/>
  </g>
  <!-- the spine: the line of the mirror -->
  <path d="M60 30v58" stroke="url(#mpl-rim)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <path d="M86 18l1.5 4.5 4.5 1.5-4.5 1.5L86 30l-1.5-4.5L80 24l4.5-1.5Z" fill="#fff"/>
</svg>
